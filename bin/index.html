<!DOCTYPE html>
<html><head>
	<link rel="stylesheet" href="style.css"/>
	<title>YAL's PDF to Foundry Journal Converter</title>
	<meta property="og:title" content="YAL's PF2e PDF to Foundry Journal Converter" />
	<meta property="og:description" content="Grabs text (and images!) from Paizo PDFs for use in Foundry journals!" />
</head><body>
	<script src="lib/pdf.mjs" type="module"></script>

	<script src="script.js"></script>
	<script src="wrapper.mjs" type="module"></script>
	
	<form id="file-picker-form">
		<input type="file" id="file-picker" accept=".pdf,application/pdf"/>
	</form>
	<main id="app"><section id="config">
		<input type="button" value="Open PDF" id="pick-pdf" />
		<label title="Disabling this improves performance">
			<input type="checkbox" id="extract-images" checked/>
			<span>Get images</span>
		</label>
		<label for="edge-top">Top:</label>
		<input  id="edge-top" type="number" value="10"/>
		<label for="edge-bottom">Bottom:</label>
		<input  id="edge-bottom" type="number" value="7"/>
		<label>
			<input type="checkbox" id="edge-auto" checked/>
			Auto-detect
		</label>
		<label for="edge-left">Left:</label>
		<input  id="edge-left" type="number" value="10"/>
		<label for="edge-right">Right:</label>
		<input  id="edge-right" type="number" value="10"/>
		<label for="edge-x">Offset:</label>
		<input  id="edge-x" type="number" value="0"/>
	</section><section id="pdf">
		<div class="header">
			Page
			<input type="button" id="page-prev" value="↑" />
			<input type="button" id="page-next" value="↓" />
			<input type="number" id="page-number" value="1" style="width: 2.5em"/>
			of <span id="page-count">1</span>
			· Preview resolution (%):
			<input type="number" id="page-scale" value="150" step="5" style="width: 3.5em"/>
		</div>
		<div id="pdf-canvas">
			<canvas id="the-canvas"></canvas>
		</div>
	</section><section id="out">
		<div class="header">
			<input type="button" id="copy-html" value="Copy HTML" />
			<input type="button" id="show-images" value="Show images" />
		</div>
		<div id="preview-and-images">
			<div id="page-images"></div>
			<div id="preview"></div>
		</div>
	</section></main>
</body></html>
