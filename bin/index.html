<!DOCTYPE html>
<html><head>
	<link rel="stylesheet" href="style.css"/>
</head><body>
	<script src="lib/pdf.mjs" type="module"></script>

	<script src="wrapper.mjs" type="module"></script>
	
	<form id="file-picker-form">
		<input type="file" id="file-picker" />
	</form>
	<main id="app"><section id="config">
		<input type="button" value="Open PDF" />
		<label for="edge-left">Left:</label>
		<input  id="edge-left" type="number" value="10"/>
		<label for="edge-right">Right:</label>
		<input  id="edge-right" type="number" value="90"/>
		<label for="edge-x">Offset:</label>
		<input  id="edge-x" type="number" value="0"/>
		<label for="edge-top">Top:</label>
		<input  id="edge-top" type="number" value="10"/>
		<label for="edge-bottom">Bottom:</label>
		<input  id="edge-bottom" type="number" value="90"/>
	</section><section id="pdf">
		<div class="header">
			<input type="number" id="page-number" value="1" />
		</div>
		<div id="pdf-canvas">
			<canvas id="the-canvas"></canvas>
		</div>
	</section><section id="out">
		<div class="header">
			<input type="button" id="copy-html" value="Copy HTML" />
		</div>
		<div id="preview"></div>
	</section></main>
</body></html>
